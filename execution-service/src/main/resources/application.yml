server:
  port: 8085

spring:
  application:
    name: execution-service

  datasource:
    url: jdbc:mysql://localhost:3306/executiondb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: execution-service
    version: 1.0.0
    description: Execution Service for Code Collaboration Platform

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka