name: Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  sonarqube:
    name: Backend SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Backend SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd CodeSync-Backend
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=CodeSync \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io

  deploy:
    name: Deploy Backend
    needs: sonarqube
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH and Build Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/CodeSync && cd ~/CodeSync
            
            # Auto-clone or pull Backend
            if [ ! -d "CodeSync-Backend" ]; then
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/CodeSync-Backend.git
            fi
            cd CodeSync-Backend && git pull origin main
            
            # Build backend services
            docker-compose up --build -d \
              eureka-server config-server api-gateway auth-service \
              project-service collab-service comment-service \
              execution-service file-service notification-service version-service
            docker image prune -f
