name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarqube:
    name: Backend SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Backend SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=CodeSync \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'krishnaslal' }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=false

  deploy:
    name: Deploy Backend
    needs: sonarqube
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH and Build Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/CodeSync && cd ~/CodeSync
            
            # Auto-clone or pull Backend
            if [ ! -d "Code-Collaboration-Platform-backend" ]; then
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/Code-Collaboration-Platform-backend.git
            fi
            cd Code-Collaboration-Platform-backend && git pull origin main
            
            # Build backend services
            # Try to use sudo docker compose (modern Docker)
            sudo docker compose up --build -d \
              eureka-server config-server api-gateway auth-service \
              project-service collab-service comment-service \
              execution-service file-service notification-service version-service || \
            sudo docker-compose up --build -d \
              eureka-server config-server api-gateway auth-service \
              project-service collab-service comment-service \
              execution-service file-service notification-service version-service
              
            sudo docker image prune -f
