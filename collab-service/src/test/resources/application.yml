spring:
  datasource:
    url: jdbc:h2:mem:collabdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  rabbitmq:
    listener:
      type: simple
    host: localhost # Tests should mock this or ignore connection errors
eureka:
  client:
    enabled: false
