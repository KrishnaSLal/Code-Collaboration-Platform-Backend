server:
  port: 8082

spring:
  application:
    name: project-service

  datasource:
    url: jdbc:mysql://localhost:3306/projectdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: project-service
    version: 1.0.0
    description: Project Service for Code Collaboration Platform

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka