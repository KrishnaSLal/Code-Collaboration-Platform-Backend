version: '3.8'

services:
  # Service Registry
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SPRING_DATASOURCE_URL=${AUTH_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  # Config Server
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${AUTH_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server
    environment:
      - SPRING_DATASOURCE_URL=${AUTH_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - codesync-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      - eureka-server
      - api-gateway
    environment:
      - SPRING_DATASOURCE_URL=${AUTH_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - CODESYNC_EXPOSE_OTP=${CODESYNC_EXPOSE_OTP}
    networks:
      - codesync-network

  # Other Microservices
  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${PROJECT_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  collab-service:
    build:
      context: .
      dockerfile: collab-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${COLLAB_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  comment-service:
    build:
      context: .
      dockerfile: comment-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${COMMENT_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  execution-service:
    build:
      context: .
      dockerfile: execution-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${EXECUTION_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${FILE_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${NOTIFICATION_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_MAIL_USERNAME=${NOTIFICATION_MAIL_USERNAME}
      - NOTIFICATION_MAIL_PASSWORD=${NOTIFICATION_MAIL_PASSWORD}
    networks:
      - codesync-network

  version-service:
    build:
      context: .
      dockerfile: version-service/Dockerfile
    depends_on:
      - eureka-server
    environment:
      - SPRING_DATASOURCE_URL=${VERSION_SERVICE_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - RABBITMQ_HOST=rabbitmq
    networks:
      - codesync-network

  # Frontend
  frontend:
    build:
      context: ../Code-Collaboration-Platform-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - codesync-network

  # Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      # We don't specify MYSQL_DATABASE here because we want to create multiple DBs
    ports:
      - "3306:3306"
    networks:
      - codesync-network
    volumes:
      - mysql-data:/var/lib/mysql
      # Initialization script to create all databases
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  # Messaging
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - codesync-network

networks:
  codesync-network:
    driver: bridge

volumes:
  mysql-data:
