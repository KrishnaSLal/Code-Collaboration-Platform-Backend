server:
  port: 8088

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/notificationdb
    username: root
    password: root

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${NOTIFICATION_MAIL_USERNAME}
    password: ${NOTIFICATION_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: notification-service
    version: 1.0.0
    description: Notification Service for Code Collaboration Platform

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

codesync:
  rabbitmq:
    notifications:
      exchange: codesync.notifications.exchange
      queue: codesync.notifications.queue
      routing-key: notification.session.invite
